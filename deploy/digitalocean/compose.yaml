# AP Venture digital factory on one DigitalOcean droplet.
#
# openbot           the all-in-one image: app, API, the shared browser and its own PostgreSQL.
# agent-claude-sdk  the Claude harness. Built-in Bots run on the company Claude plan through it.
# caddy             TLS in front of port 3001, with certificates from Let's Encrypt.
# opentag           Slack, through CopilotKit OpenTag. Only with --profile slack (AP-88).
#
# The routine and attachment sweeps run from host cron through sweeps.sh, because the embedded
# PostgreSQL only listens inside the openbot container (docs/deployment.md, "Not in it").
#
# Every Bot shares the one browser in v1. That is the trade docs/deployment.md describes as fine for
# one team that trusts its own Bots. A computer per Bot needs the supervisor and is a later step.
#
# Run from this directory: docker compose --env-file .env up -d

services:
  # Built from our factory/v0.2.0 branch: the {OPENBOT_VERSION} release plus our own changes
  # (OPENTAG_ANSWER_IN_CHANNELS, AP-92). Pinned to a commit; the first build takes several minutes.
  openbot:
    build:
      context: https://github.com/Ascentwright-Capital/OpenBot.git#${OPENBOT_REF:-f4dd90c56a388872654f0efe054cbe39249c4f1b}
    image: digital-factory/openbot:${OPENBOT_REF:-f4dd90c56a388872654f0efe054cbe39249c4f1b}
    restart: unless-stopped
    env_file: .env
    environment:
      EMBEDDED_POSTGRES: "on"
      PICKED_HARNESS_IMAGE: ghcr.io/copilotkit/openbot-agent-claude-sdk:${OPENBOT_VERSION}
      PICKED_HARNESS_URL: http://agent-claude-sdk:4212
      # Our coworkers instead of the fintech example (tenant/README.md).
      TENANT_PACKAGE_DIR: /tenant
    volumes:
      - ./tenant:/tenant:ro
      # The parent of the data directory, not the data directory itself (docs/deployment.md).
      - openbot-postgres:/var/lib/postgresql
      - openbot-workspace:/workspace
    expose:
      - "3001"
    depends_on:
      agent-claude-sdk:
        condition: service_healthy

  agent-claude-sdk:
    image: ghcr.io/copilotkit/openbot-agent-claude-sdk:${OPENBOT_VERSION}
    restart: unless-stopped
    environment:
      # One of the two, never both: the harness refuses to start with both set.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?set MANAGED_AGENT_TOKEN in .env}
      OPENBOT_TOOL_URL: http://openbot:3001/api/agent-tools/call
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN:-}
    expose:
      - "4212"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4212/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenTag calls OpenBot as its agent; Slack credentials live in CopilotKit Intelligence, which
  # OpenTag reaches over an outbound WebSocket, so nothing here is published. Built from our copy
  # of OpenTag's openbot-pairing branch (Ascentwright-Capital/OpenTag), pinned to a commit. Ours
  # adds OpenBot's proactive sends (/openbot/deliver) and channel-membership checks
  # (/openbot/membership), posted with the Slack app's bot token, and marks Slack DMs as private.
  opentag:
    profiles: ["slack"]
    build:
      context: https://github.com/Ascentwright-Capital/OpenTag.git#${OPENTAG_REF:-63b3904a540129966a5e4db94038064189e68a1d}
      dockerfile: deployment/docker/runtime.Dockerfile
    image: digital-factory/opentag-runtime:${OPENTAG_REF:-63b3904a540129966a5e4db94038064189e68a1d}
    restart: unless-stopped
    environment:
      AGENT_URL: http://openbot:3001/api/delivery/webhooks/opentag/agent
      AGENT_AUTH_HEADER: Bearer ${OPENTAG_SHARED_SECRET:-}
      OPENBOT_PAIRING: "true"
      OPENBOT_SLACK_BOT_TOKEN: ${OPENTAG_SLACK_BOT_TOKEN:-}
      AGENT_DISPLAY_NAME: ${OPENTAG_DISPLAY_NAME:-Factory}
      INTELLIGENCE_API_KEY: ${INTELLIGENCE_API_KEY}
      INTELLIGENCE_CHANNEL_NAME: ${INTELLIGENCE_CHANNEL_NAME:-digital-factory}
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - openbot

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENBOT_DOMAIN: ${OPENBOT_DOMAIN:?set OPENBOT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - openbot

volumes:
  openbot-postgres:
  openbot-workspace:
  caddy-data:
  caddy-config:

# One starting conversation per coworker on the web, named like its Slack channel.
channels:
  - id: front-desk
    name: 00-00-factory-master
    description: "Start here: ask the factory anything. 00 Factory Master hands it to the right coworker."
    permitted_agents: [orchestrator]
    allowed_groups: [all]
  - id: strategy-pitch
    name: 00-10-strategy-pitch
    description: "Pitches, one-pagers, key messages, fundraising; finding researchers and advisers."
    permitted_agents: [strategy-pitch]
    allowed_groups: [all]
  - id: recruitment
    name: 00-20-recruitment
    description: "Job descriptions, CV screening, onboarding and reviews."
    permitted_agents: [recruitment]
    allowed_groups: [all]
  - id: cto
    name: 00-30-cto
    description: "Changes to ascentwright.com and tech questions for the holding."
    permitted_agents: [cto]
    allowed_groups: [all]
  - id: software-factory
    name: 00-31-digital-factory
    description: "Code changes as pull requests from a Linear issue; requests for new or changed coworkers."
    permitted_agents: [software-factory]
    allowed_groups: [all]
  - id: analytics
    name: 00-32-analytics
    description: "Questions answered with data, read-only."
    permitted_agents: [analytics]
    allowed_groups: [all]
  - id: marketing-director
    name: 00-40-marketing-director
    description: "Any marketing request, for any company: the director briefs the marketing team and gives one answer."
    permitted_agents: [marketing-director]
    allowed_groups: [all]
  - id: marketing-research
    name: 00-41-marketing-research-insights
    description: "Market, customer and competitor research, with sources."
    permitted_agents: [marketing-research]
    allowed_groups: [all]
  - id: marketing-strategy
    name: 00-42-marketing-strategy-planning
    description: "Positioning, marketing plans, budget options, calendars and campaign briefs."
    permitted_agents: [marketing-strategy]
    allowed_groups: [all]
  - id: marketing-content
    name: 00-43-marketing-brand-content
    description: "Brand voice, posts, copy, scripts and creative briefs, as drafts for approval."
    permitted_agents: [marketing-content]
    allowed_groups: [all]
  - id: marketing-channels
    name: 00-44-marketing-channels-growth
    description: "Google Maps and search, social, ads, WhatsApp and partnerships: channel plans."
    permitted_agents: [marketing-channels]
    allowed_groups: [all]
  - id: marketing-performance
    name: 00-45-marketing-performance-reporting
    description: "Marketing KPIs, measurement plans, reports and test readouts."
    permitted_agents: [marketing-performance]
    allowed_groups: [all]
  - id: aw-memory
    name: 00-90-aw-memory
    description: "Meeting notes in, decisions and action items out; ask what was decided."
    permitted_agents: [aw-memory]
    allowed_groups: [all]
  - id: adiruang-cto
    name: 01-30-adiruang-cto
    description: "Changes to the Adiruang website, including the consultation booking."
    permitted_agents: [adiruang-cto]
    allowed_groups: [all]
  - id: nusa-auto-cto
    name: 02-30-nusa-auto-cto
    description: "Questions and small changes for the Nusa Auto app."
    permitted_agents: [nusa-auto-cto]
    allowed_groups: [all]
  - id: marketing
    name: 02-40-nusa-auto-marketing
    description: "Nusa Auto content, Google Maps and reviews, WhatsApp, Instagram/TikTok and local ads."
    permitted_agents: [marketing]
    allowed_groups: [all]
  - id: nusa-auto-commercial
    name: 02-50-nusa-auto-commercial
    description: "Nusa Auto prices, plans, subscriptions and promotions: answers from the price book, proposals for Arthur."
    permitted_agents: [nusa-auto-commercial]
    allowed_groups: [all]
  - id: cilook-director
    name: 03-00-cilook-director
    description: "Anything Cilook: status, priorities, and hand-offs to the Cilook team."
    permitted_agents: [cilook-director]
    allowed_groups: [all]
  - id: cilook-marketing
    name: 03-40-cilook-marketing
    description: "Cilook content, social, deposit page words and messages to families, as drafts for approval."
    permitted_agents: [cilook-marketing]
    allowed_groups: [all]
  - id: cilook-product
    name: 03-60-cilook-product
    description: "Cilook features, backlog, specs and experiments."
    permitted_agents: [cilook-product]
    allowed_groups: [all]
  - id: cilook-pilot-ops
    name: 03-61-cilook-pilot-ops
    description: "Cilook pilot homes, consent, schedules, nanny onboarding and the issue log."
    permitted_agents: [cilook-pilot-ops]
    allowed_groups: [all]
  - id: cilook-research
    name: 03-62-cilook-research
    description: "Evidence, regulation and market research for Cilook, with sources."
    permitted_agents: [cilook-research]
    allowed_groups: [all]

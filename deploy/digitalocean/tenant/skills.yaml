    title: "Cilook status and priorities"
    summary: "Where Cilook stands: next date, done, late, blockers and owners."
    instructions: |-
      1. Read Linear "03 Cilook" (P-AP-10) and KB 16 section 6.
      2. Answer: the next milestone and date (deposit page, Wave 1, Wave 2, Gate A 29 Jan 2027); what is done; what is late; open questions blocking it (KB 16 section 8); owner of each.
      3. Top 3 priorities for this week with the coworker or person who does each.
      4. Keep the Linear document "Cilook status" up to date when asked. Decisions are Arthur's: list proposals, never decide.

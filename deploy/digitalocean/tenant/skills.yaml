  - slug: meeting-notes
    title: "Meeting notes and transcript"
    summary: "Clean a transcript and write the synthesis with decisions, actions and open questions."
    instructions: |-
      Method KB 12.
      1. Read everything first; load context (KB 01, KB 05, KB 06, the company's Linear project). Known names: Claire = Cilook, WD/Widi = Arthur, Fae = Fausto, Ken = Kenneth, Ito = Kristoforus Adhitya.
      2. Clean: fix misheard words, names and terms; keep speakers, timestamps, doubt and disagreement; check numbers, currencies, dates, negations ("tidak", "belum", "bukan") twice. Unclear and consequential: quote it, give the readings, ask; else [UNCLEAR: ...].
      3. Synthesis by topic: purpose and takeaway; points and reasoning; decisions made (mark "proposed" unless Arthur stated them); open ideas; implications labelled as interpretation; risks; next steps.
      4. Two action lists: "Agreed in the meeting" and "Suggested follow-up (AW Memory)"; owner and date only if said.
      5. File "YYYY-MM-DD <meeting> - synthesis" (and the transcript) in the company's Linear project; reply with the summary and link. Leave out pay, personal data and Arthur's positions toward others.

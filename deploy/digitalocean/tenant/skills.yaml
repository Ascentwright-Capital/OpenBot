  - slug: cilook-issue-log
    title: "Cilook pilot issue log and weekly read"
    summary: "Log pilot issues and write the weekly pilot read."
    instructions: |-
      1. Issue log entry: date, home code, what happened, severity (low / medium / high), owner, fix, status.
      2. Health, safety or development worry: tell the parent to contact their doctor, midwife or posyandu, and tell Arthur the same day; never give advice.
      3. Weekly pilot read: homes by stage; plans sent vs done; nanny minutes per day; parent recap opens; issues; what to change next week. Numbers only from logs; missing = "n/a".
    tools: []
  - slug: cilook-evidence-check
    title: "Cilook evidence check"
    summary: "Grade the evidence for a practice or claim and class it BC / EV / PS / EM."
    instructions: |-
      Method KB 17 sections 2-5.
      1. Check KB 16 and the research log for existing sources first; reuse IDs.
      2. Sources in order: WHO, IDAI, Kemenkes, Buku KIA → systematic reviews → RCTs → observational → practitioner. Open each one; mark anything not opened or secondary.
      3. Per source: type, quality, applicability to Jakarta homes with a 1-3-year-old and a nanny, date, date opened, status.
      4. Class the practice: BC consensus / EV evidence, context-dependent / PS paradigm-specific / EM emerging; keep class, evidence level and applicability separate. Paradigms are tags, never outcome claims.
      5. Output: answer, sources table, limits. New sources to the Linear document "Cilook research log"; ask 03-60 or 00-41 to review before use.
    tools: []
  - slug: cilook-regulation-check
    title: "Cilook regulation check"
    summary: "Check a feature or claim against Indonesian rules on health software, child data and domestic work."
    instructions: |-
      1. Which rule could apply: Kepmenkes 951/2026 (diagnosis, screening or monitoring software = medical device), PP 33/2026 (verified parental consent from 16 Jan 2027), PP Tunas, UU 2/2026 (domestic workers), Permendikdasmen 3/2025 (no calistung tests for school entry), personal data law.
      2. Read the official text; quote the article; date opened.
      3. Say what the rule means for the feature, what is clear and what counsel must confirm. Never present your reading as legal advice.
    tools: []
  - slug: cilook-interview-synthesis
    title: "Cilook interview synthesis"
    summary: "Turn parent or nanny interview notes into evidence with small-n labelled."
    instructions: |-
      1. Who: segment fit (working parent with a nanny or babysitter, child 12-36 months, Jakarta), date, interviewer.
      2. What they said: quotes in their words, by theme (feeding, school readiness, trust, coordination, price).
      3. What it may suggest, labelled as interpretation; what it does not show.
      4. Compare with earlier interviews (KB 16 section 5): agrees, contradicts, new.
      5. Always "hypothesis, n = X", never "validated". Prices: quote the question asked and the answer.
    tools: []
  - slug: cilook-benchmark
    title: "Cilook competitor benchmark"
    summary: "Benchmark parenting, childcare and caregiver apps against Cilook."
    instructions: |-
      1. Each competitor: name, what it does, who it is for, price with date and link, platform, what users praise and complain about (real reviews, linked).
      2. What it means for Cilook: what to copy, what to avoid, where we are different (built for the carer, WhatsApp in Bahasa, under 2 minutes a day).
      3. Open every source; mark anything older than 6 months "to re-check".
    tools: []

  - slug: cilook-pilot-plan
    title: "Cilook pilot plan and home tracker"
    summary: "Keep the pilot calendar, the home tracker (codes only) and the consent checklist."
    instructions: |-
      1. Calendar: Wave 1 (8-10 homes, free, three baseline days first), Wave 2 (10-15 homes, baseline, 7-day trial, then monthly charge), Gate A on week-4 reads; Ramadan and Idul Fitri marked.
      2. Home tracker (Linear document): home code H01..., segment fit, stage (invited, consented, baseline, active, paused, left), start date, owner, next step. No names, phones, addresses, photos or child details.
      3. Before day one: written parental consent incl. any photo use; the nanny's agreement and fair treatment (UU 2/2026); safety-floor briefing; verified-consent rules from 16 Jan 2027 (PP 33/2026).
      4. Messages to families or nannies: drafts for Destrin or Arthur to send.

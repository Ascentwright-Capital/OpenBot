  - slug: decision-lookup
    title: "What did we decide"
    summary: "Answer what was decided, who owns what, or what is open, with the source."
    instructions: |-
      1. Look in KB 06 first, then the Linear Decision logs, project documents and issues.
      2. Answer with the decision ID or source, the date and who decided. Proposed is not decided: say which it is.
      3. Two records disagree: show both with dates and ask who should settle it; never pick one.
      4. Not found: say so plainly and suggest who would know.

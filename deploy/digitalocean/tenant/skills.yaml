    summary: "Member caps, redemptions, churn, notice rules and window pricing for plans."
    instructions: |-
      KB 15 Part 2, jobs C and D.
      1. Track per plan: members vs cap, redemptions vs quota, breakage, weekend share of member washes, cannibalisation ("where did you wash last?"), churn and failed payments. No data: say what is needed from whom.
      2. Price change for existing members: 30 days' notice and the member's consent (D-49, D-64); monthly members from next month, yearly at renewal.
      3. Optimise: window prices and extra-wash prices, Good-Better-Best bundles, add-ons only in the finishing lane, promotions with end date, cap and measure, A/B tests with stop rules, large-vehicle surcharge only for large SUV, premium MPV, double cab.
      4. Yearly billing only once redemption data exists.

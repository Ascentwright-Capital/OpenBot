# Skills this deployment ships, and the tools each one needs.
#
# A skill is a named instruction anybody here can invoke with `/`. It adds no capability: it can only
# ask a Bot to use what that Bot was already granted, and every one of those calls is still decided,
# policy-checked and recorded.
#
# `tools:` is the second thing a skill is for, and the reason this file exists rather than a screen.
# A Bot holding more than a handful of tools is offered, per run, only the tools of the skills that
# match the message, because a model picks the right tool reliably out of about ten and unreliably
# out of thirty. That matching needs skills to match against, and a deployment starts with none — so
# left to a screen, the narrowing is switched off on every clone until somebody maps tools to skills
# by hand, in each deployment, again after each new connector. Shipping the declaration with the
# skill is what makes connecting a connector the only step.
#
# NAMING A TOOL HERE GRANTS NOBODY ANYTHING. What a Bot may call is its grants, and the offer is
# always intersected with them: a skill naming a tool its Bot does not hold loads nothing. So this
# file may name tools for connectors this deployment has not added, and should — that is what makes
# them work the moment somebody does.
#
# Refs are `<serverId>/<toolName>`, the same form a grant is written in. `google-drive` and `notion`
# are catalogue connectors; a server an administrator adds by URL uses the id it was given.
skills:
  - slug: research-public-web
    title: Research the public web
    summary: Search current public sources and write a cited brief.
    instructions: >-
      Use the public-web research tools you hold to discover relevant sources and read selected
      pages before answering. Honor an explicit user choice of another authorized provider. Keep
      search objectives specific and queries concise. Send only the necessary research objective,
      queries and URLs; do not send whole conversations or private documents. Cite the source URLs
      and state missing evidence or provider errors. A missing grant requires an administrator;
      never work around a denial.
    tools:
      - "@research/search"
      - "@research/fetch"

  - slug: find-a-document
    title: Find a document
    summary: Search the connected document sources for a file and read what it says.
    instructions: >-
      Find the document the person is asking about before answering anything about its contents.
      Search first, then read the file you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the
      document might contain. Name the document you used.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content
      - google-drive/get_file_metadata

  - slug: find-a-notion-page
    title: Find a Notion page
    summary: Search Notion for a page and read what it says.
    instructions: >-
      Find the Notion page the person is asking about before answering anything about its contents.
      Search first, then fetch the page you found rather than answering from its title. If the search
      returns nothing, say so and say what you searched for, rather than guessing at what the page
      might contain. Name the page you used.
    tools:
      - notion/notion-search
      - notion/notion-fetch

  - slug: whats-changed
    title: What changed recently
    summary: List recently changed documents and say who changed them and when.
    instructions: >-
      List what has changed recently in the sources you can reach, newest first. Give the document
      name, who last changed it and when, and keep it to the ones that actually moved in the period
      asked about. Do not summarise contents unless you are asked to; this is a list of what moved.
    tools:
      - google-drive/list_recent_files
      - google-drive/get_file_metadata

  - slug: who-owns-this
    title: Who owns this
    summary: Find who owns a document and when they last touched it.
    instructions: >-
      Identify the owner of the document being asked about, and say when it was last changed. Search
      for the document first if you were given a name rather than a link. If more than one document
      matches, say so and list them rather than picking one.
    tools:
      - google-drive/search_files
      - google-drive/get_file_metadata

  - slug: check-a-claim
    title: Check a claim against a source
    summary: Take a statement and check it against what the documents actually say.
    instructions: >-
      You are checking a claim, not answering a question. Find the source that would settle it, read
      it, and say one of three things: the source supports the claim, the source contradicts it, or
      the source does not address it. Quote the sentence you are relying on. Do not fill a gap in the
      source with your own knowledge — "the source does not say" is a complete answer.
    tools:
      - google-drive/search_files
      - google-drive/read_file_content

  # The skill that writes skills. Its instruction is the whole feature: `save_skill` and the three
  # reads beside it are offered to a Bot only while it holds this slug, so granting this is what turns
  # a coworker into one you can author with. See app/src/lib/copilot/skill-tools.tsx.
  #
  # Declares no tools, and should not. The authoring tools are the app's own rather than a connector's,
  # so they are not `serverId/toolName` refs and a declaration here would name nothing. Selection only
  # ever narrows MCP tools; these are offered whenever the grant is there.
  - slug: skill-creator
    title: Write a skill
    summary: Interview me about a skill I want, write it, and save it as a new `/` command.
    instructions: |-
      You are writing a skill: a named instruction anybody in this deployment can invoke with `/`.
      Interview first, write second, and save only what the person has agreed to.

      A skill here is four things and nothing else. A command, which is its slug and its identity. A
      title, for the menu. A one-line summary. And the instruction a Bot follows when somebody invokes
      it. It may also declare the tools it needs, which is a declaration rather than a grant: naming a
      tool cannot make it callable, and a skill naming a tool its Bot does not hold simply loads
      nothing. There are no files, no scripts, no attachments and no example folders. Anything that
      cannot be said in those fields does not belong in a skill, and saying so early is kinder than
      discovering it at the end.

      Work in this order.

      1. Find out what the skill is for, in the person's own words. What should the Bot do that it does
         not reliably do now? When would they reach for this rather than just asking? What should come
         back — a list, a verdict, a drafted message, a number? If they have asked for the same thing
         three times in different words, that repetition is the skill; say so.

      2. Interview until you could do the task yourself. Ask about the order of steps, what counts as
         done, what the answer must contain, and above all what should happen when a step turns up
         nothing — that is the case a weak skill leaves out and the case that actually occurs. Ask
         about the shape of the output if the output has a shape. Do not ask more than three questions
         in one message, and do not ask what you can infer.

      3. Look before you name. Call `list_skills`. A slug is an identity, so reusing one replaces that
         skill: if what they want already exists, improve that one instead of writing a near-duplicate,
         and if the name they want belongs to somebody else, pick another and tell them why. A slug is
         lower-case letters, numbers and hyphens, and reads as a command — `check-a-claim`, not
         `Check_A_Claim`.

      4. Write the instruction. Address the Bot, in the imperative, as directions for the run. Never
         describe the skill in the third person and never address the person invoking it.

      5. Declare the tools it needs, if it needs any. Call `list_skill_tools` for the refs; never
         invent one. Declare tools for a connector this Bot does not hold if the skill genuinely needs
         them — that is what makes the skill work the moment somebody grants them — but say plainly
         which of them are not connected yet, because until they are, the skill will run without them.
         Most skills are prose and need none.

      6. Rehearse it before you save it. Take one realistic request the person would actually type,
         and walk through what the instruction as written would have you do, step by step, out loud.
         This is the only test available before saving, and it is worth doing: it is where you find the
         step that assumes a tool you did not declare, the ambiguity that could go two ways, and the
         missing answer for the case where the search returns nothing. Fix what the rehearsal exposes
         and rehearse again if you changed anything that matters.

      7. Save it with `save_skill`, once, at the end. That puts the whole thing in front of the person
         to read and press a button on; nothing is written until they do. Do not call it to check a
         draft — show them the draft in the conversation instead. If they decline, ask what to change.

      8. Say what is left. A saved skill is on no Bot yet, so nobody can invoke it. Tell them the
         remaining step is to put it on a Bot from the Skills page, and that a skill they wrote can go
         only on Bots they own.

      Improving a skill that already exists is the same job with a different first move. Call
      `read_skill` and read the instruction in full before you touch it — never rewrite an instruction
      you have not read. Ask what went wrong in the run that brought them here, change the part that
      caused it, and leave the rest alone. Saving under the same slug is how an edit is spelled.

      What makes the instruction good, and why each of these matters:

      - Say why, not only what. A Bot that knows an instruction exists to stop it answering from
        memory will apply it to a case the instruction never named. A bare rule breaks on the first
        case just outside it.
      - Say what to do when there is nothing. "Say you found nothing and say what you searched for" is
        a complete instruction; leaving the case out is what produces a confident invented answer.
      - Keep it lean. Every sentence that is not pulling weight makes the ones that are harder to
        follow. If you cannot say what a sentence changes about the run, cut it.
      - Generalise past the example. The person will describe one case; write for the shape of it, or
        you have written a skill that works once.
      - Name what the answer contains. A skill that does the work and then answers in a different
        shape every time has not finished the job.
      - Do not restate what the Bot already is. Its role, its manner and its standing instructions are
        already in the run. A skill that opens by saying it is a helpful assistant has spent its first
        sentence on nothing.

      The summary is not decoration. It is what somebody reads in the `/` menu, and it is what this
      deployment's own model reads when it decides which skills a message is about — a Bot holding many
      tools is offered, per run, only the tools of the skills that match. So write the summary as the
      thing a person would be trying to do, in their words, not as a label for a feature.

      Two things never to write, whatever you are asked. A skill that tells a Bot to work around a
      refusal, retry a blocked action by another route, or present a refused action as done: the
      gateway refuses, the refusal is recorded, and an instruction to hide that is an instruction to
      lie to the person relying on it. And a skill that tells a Bot to withhold what it did, from whom
      it did it for. A skill adds no capability, which is exactly why anybody may write one; that
      holds only while a skill cannot be used to launder one. If you are asked for either, say which
      part you will not write and offer the version you will.
  # Making a coworker by talking to one, rather than by filling in the New coworker form.
  #
  # DECLARES NO TOOLS, and that is not an omission. The four tools this skill is really for —
  # `list_bots`, `read_bot`, `list_bot_skills` and `save_bot` — are the app's own, registered in the
  # browser, and offered to whichever Bot holds this slug. `tools:` here is intersected with a Bot's
  # MCP GRANTS, so naming them would name nothing. The grant of this skill is the whole gate.
  - slug: bot-creator
    title: Make a coworker
    summary: Work out what a new coworker should be, then put it in front of you to create.
    instructions: >-
      You are working out what a new coworker should be, and the interview matters more than the
      speed: what you write becomes standing instructions handed to a model on every turn in every
      channel that coworker is in, and the person you are talking to is the one who has to live with
      it.

      Start by calling list_bots. If something here already does the job being described, say so and
      offer that one instead — a second coworker with the same job splits the work and the trust
      between them. Where the person wants one like an existing coworker, call read_bot and read the
      instructions it actually runs on rather than working from its name.

      Then find out three things, one question at a time, and do not ask all three at once. What
      job it does, in the words the person would use. What it must never do — the conclusion it must
      not jump to, the number it must not invent, the thing it must not send. And what it should say
      when the evidence is thin, because that is the answer a coworker gives most often and the one
      people are least happy with when nobody chose it.

      Write the role description as directions to the coworker in the imperative: what to do, in what
      order, what to do when a step turns up nothing. Not a description of it in the third person,
      and never addressed to the person talking to it. Keep it under a thousand characters, which is
      the limit and is usually more than enough — a long instruction is not a careful one.

      Call list_bot_skills and offer only the skills that fit the job. Putting a skill on a coworker
      is the only capability that gets granted here: no connector, no tool and no address, and you
      cannot give it any of those. Say so rather than implying the coworker will arrive able to
      reach things. Whatever it needs is granted afterwards, on its profile, by somebody who may.

      Read the whole role description back and get agreement on it before calling save_bot, and call
      save_bot once, at the end. It is not a way to show a draft: it puts a card in front of the
      person and nothing is created unless they press the button.
    tools: []

  # Tailored skills (AP-144). One per job, granted to the coworkers that do that job (agents.yaml
  # `skills:`). The same text is copied into each coworker's system_prompt under "Your skills", because
  # a built-in coworker only sees a skill's instruction when a person types its `/` command on the web.
  # Change the text here and rerun the generator so both stay in step. No tools declared: tool
  # narrowing stays off and Linear stays offered on every run.
  - slug: hand-over-a-request
    title: "Hand a request to a coworker"
    summary: "Package a request so the coworker it goes to never has to ask again."
    instructions: |-
      Use for every hand-over, after the routing rules in your role have picked the coworker.
      1. Write the hand-over packet: request in the person's own words; company (00, 01, 02, 03, 04); outcome wanted; deadline; links and files; what was already said in the thread; who asked.
      2. Several parts: one packet per coworker, and say who does what.
      3. Post in the thread: line 1 "<CC-DS Name> is on this"; then the result with links when it comes back.
      4. If the person used #00-00-factory-master or a direct message for one coworker's job, add one line: the channel or the prefix to use next time.
      5. Never approve, publish or decide on anyone's behalf.
    tools: []
  - slug: write-pitch-material
    title: "Write pitch or partner material"
    summary: "Draft a pitch, one-pager, intro or slide text from the approved key messages."
    instructions: |-
      1. Settle the reader (investor, partner, recruit, customer) and the one action they should take after reading; ask only if it is not obvious.
      2. Build from KB 02 word for word (one-liners, company rows); story and design rules from KB 03; investor framing from KB 04. Cilook: KB 14 approved lines and wording rules, facts from KB 16.
      3. Every figure, customer, milestone and name comes from a KB, Linear or the person. Missing: leave "[to confirm: what, who]". Never estimate.
      4. Run the "before external use" lists in KB 02 and KB 03 and list what applies under the draft.
      5. Output: the draft first, then "Needs Arthur's OK", then "Gaps". Numbers as mn / bn. You draft; a person sends.
    tools: []
  - slug: investor-research
    title: "Research investors and why-now"
    summary: "Build investor map rows, why-now entries and question banks for a raise."
    instructions: |-
      Method from KB 04 (fundraising playbook).
      1. Investor map row: fund, stage, cheque size, sector fit, Indonesia/SEA activity, a relevant portfolio company, warm route (only from KB 05 or the person), source link and date checked.
      2. Why-now entry: the change (regulation, technology, behaviour, market), the evidence with source and date, what it unlocks for our company, the risk if we wait.
      3. Question bank: the 10 questions this investor type asks most, with our current answer or "[gap]".
      4. Mark anything older than 6 months "to re-check". Never invent a fund's terms or a contact.
    tools: []
  - slug: scout-researchers
    title: "Scout researchers and advisers"
    summary: "Find and verify researchers, professors and labs as advisers or co-founders."
    instructions: |-
      Method from KB 10.
      1. Confirm the need: venture, topic, role (adviser, co-founder, research partner), place (MIT/Boston by default).
      2. For each person: name, current role and lab verified on an official page (link and date), 2-3 relevant works, why they fit, confidence (high / medium / low) with the reason.
      3. Contact route: official email shown on their page, lab administrator, or a warm route from KB 05. Never construct an email address.
      4. Rank the top 3 and draft a short outreach note for each, marked "Draft, Arthur sends".
    tools: []
  - slug: write-a-jd
    title: "Write a job description"
    summary: "Turn a role need into a JD, weighted scorecard and sourcing brief, in English and Bahasa."
    instructions: |-
      Method from KB 07.
      1. Intake: company, role, why now, outcomes in 30/90/180 days, must-haves vs nice-to-haves, location and time commitment. Ask once for what is missing.
      2. Write the JD: company paragraph word for word from KB 02, the role's outcomes first, then responsibilities and requirements. Bahasa Indonesia version beside it.
      3. Weighted scorecard: 5-7 criteria, weights adding to 100, what a 1, 3 and 5 looks like for each.
      4. Sourcing brief: where to look, search strings, screening questions.
      5. Leave pay out: "Compensation: Arthur handles directly".
    tools: []
  - slug: score-candidates
    title: "Score candidates"
    summary: "Score CVs, work samples and interview notes against the scorecard and rank them."
    instructions: |-
      Method from KB 08.
      1. Use the role's scorecard; if there is none, write it first (/write-a-jd) and ask Arthur to confirm.
      2. For each candidate and criterion: quote the evidence first (CV line, sample, interview note), then the score 1-5. No evidence = no score, write "not shown".
      3. Rank with the weighted total, state the gap between candidates and the biggest risk for each.
      4. Recommend next step per candidate (interview, work test, decline). Never compare on pay, age, religion, ethnicity, gender or family status.
    tools: []
  - slug: onboard-and-review
    title: "Onboarding and reviews"
    summary: "Write 30/60/90 plans, check-ins and probation or performance reviews."
    instructions: |-
      Method from KB 09.
      1. Accepted offer or start date: a 30/60/90 plan with 3-5 outcomes each, a buddy, tools and access to request, and the first-week calendar.
      2. Check-ins: what was planned, what happened, blockers, next two weeks.
      3. Probation end or review: evidence against the plan and the AscentWright Leadership Development Model, a rating proposal, development actions. Mark it "proposed: Arthur decides".
      4. No pay, contract terms or personal data in what you write: Arthur handles those directly.
    tools: []
  - slug: make-a-site-change
    title: "Make a website or app change"
    summary: "Turn a request into a Linear issue, a branch and a pull request with a preview link."
    instructions: |-
      1. Issue: find or draft the Linear issue in the company's project (title, why, done when; label Website for site work). Ask the person to confirm a drafted one.
      2. Read the repository's AGENTS.md and README, then KB 11 for owners and standing rules.
      3. Plan in the thread: files, what the person will see, how you will test. Wait for "go" unless it is a text or image fix.
      4. Branch type/ap-number-slug; titles "[Type] Summary (AP-n)"; no AI credit lines.
      5. Run every check the repository lists; open the pull request with results and the preview link; post the link. Never push to main or merge: Ken reviews and merges.
      6. If your GitHub tools only read: put the exact change (file, old text, new text, both languages) in the Linear issue and say a person must apply it.
    tools: []
  - slug: answer-from-the-code
    title: "Answer how something works"
    summary: "Answer a question about a site or app from the code and the Linear specs, with file references."
    instructions: |-
      1. Find the answer in the repository (read the files, not just names) and in the Linear specs and Decision log of the company's project.
      2. Answer first in plain words, then "Where": file paths and line ranges, Linear IDs.
      3. If code and spec disagree, show both and say which one runs today.
      4. If you cannot read it, say what you could not reach and who can (Ken for code and hosting).
    tools: []
  - slug: nusa-auto-price-lookup
    title: "Look up a Nusa Auto price"
    summary: "Quote a Nusa Auto price or plan from the price book with its version and status."
    instructions: |-
      1. Read KB 15 Part 1 (price book). Quote the exact row: price, what it includes, window, band.
      2. Always add the version (v1.1, 5 Nov 2026) and the status: hypothesis, proposed or approved. Only approved rows may go public.
      3. Not in the book, or from a retired catalogue (KB 15 section 9): say so and never quote it. A change or a new price goes to 02-50 Nusa Auto Commercial.
    tools: []
  - slug: request-a-coworker
    title: "Request a new or changed coworker"
    summary: "Write a request for a new or changed bot as a Linear issue for Arthur and Ken."
    instructions: |-
      1. Capture: company and department (CC-DS code from Coworker roles v2), name, what it does and must never do, Slack channel #cc-ds-name, KB documents it reads, skills, tools (Linear, GitHub read/write, browser), hand-offs, human owner.
      2. Check Coworker roles v2: is the seat already defined or "to build"? Reuse its code.
      3. File it in Linear project 00 AscentWright Digital Factory (P-AP-5) with that content and a test: two example requests and the answer you expect.
      4. Tell the person Arthur (via Claude) builds bot changes and Ken reviews tools and access (D-73).
    tools: []
  - slug: answer-with-data
    title: "Answer with data"
    summary: "Answer a numbers question with the source, the calculation and a confidence level."
    instructions: |-
      1. Restate the question as a metric, a period and a scope (company, site, channel).
      2. Find the data: Linear, KB documents, files the person gives. Name each source with its date.
      3. Answer: the number first, then the inputs and arithmetic, then confidence (high / medium / low) and why.
      4. Keep targets and plans apart from results. Missing data: say exactly what is missing and who has it. Never fill a gap with an estimate unless asked, and then label it "estimate" with the assumptions.
    tools: []
  - slug: marketing-brief
    title: "Write a marketing brief"
    summary: "Turn any marketing request into a six-line brief and split the work across the team."
    instructions: |-
      1. Brief: company, audience, objective, KPI, budget (never assume one), deadline and deliverable.
      2. Small request: give it to one associate or do it yourself. Larger: insight (00-41) → plan (00-42) → content (00-43) → channels (00-44) → measurement (00-45), skipping steps already in Linear.
      3. Pick the method: Maps, content, WhatsApp or weekly report from KB 13; Cilook from KB 14; Nusa Auto prices from KB 15 (read only).
      4. Check before it goes back: answers the brief, matches KB 02 (Cilook: KB 14), every number sourced or "to confirm", nothing published or spent.
      5. Report: recommendation, a table (what, channel, owner, date, KPI), what needs approval, what is missing.
    tools: []
  - slug: market-research
    title: "Market and competitor research"
    summary: "Research a market, customer or competitor question with sources and dates."
    instructions: |-
      1. Question → what decision it informs.
      2. Sources: official and primary first, then reputable reports, then reviews and social. Open every source you cite; date and link each figure.
      3. Competitors: name, offer, price with date and link, channels, rating, what customers praise and complain about, what it means for us.
      4. Customers: who, job to be done, pains, triggers, where they look; quotes only from real sources.
      5. Output: three key insights first, then the evidence table, then limits and what to verify next.
    tools: []
  - slug: marketing-plan
    title: "Make a marketing plan"
    summary: "Positioning, channel mix, budget options and a calendar for one company."
    instructions: |-
      1. Positioning in five lines: segment, problem, our answer, proof, why us. Messages from KB 02 word for word (Cilook: KB 14).
      2. Channel mix with the role of each channel and the method from KB 13.
      3. Three budget options (lean / base / push) with what each buys and the KPI it should move; never assume a budget is approved.
      4. Calendar by week: what, channel, owner, KPI. Every promotion has an end date, a cap and a measure (Nusa Auto prices only from KB 15).
      5. File as a Linear document in the company's project when asked.
    tools: []
  - slug: maps-local-search
    title: "Google Maps and local search"
    summary: "Check a Google Business Profile, plan photos and posts, and draft review requests and replies."
    instructions: |-
      Method KB 13 section A.
      1. Listing check as a table (field, current, proposed, who fixes): name as on signage, categories, address and pin, phone or WhatsApp, hours incl. holidays, link, services with approved prices only, attributes.
      2. Photos: at least 10 real ones before launch; impressions of unbuilt sites never go on Maps.
      3. Reviews: same request to every customer at the moment of delight, no rewards; reply within 48 h (positive: thank, name the service, invite back; negative: apologise, move to WhatsApp with a named person, no personal data).
      4. One Google post a week. Local search: 10 phrases people nearby type, where we and 3 competitors rank, fixes.
      5. Monthly measures: views, calls, directions, clicks, reviews, rating, reply time.
    tools: []
  - slug: content-social
    title: "Content and social posts"
    summary: "Plan pillars and a content calendar, and draft posts, captions and short-video scripts."
    instructions: |-
      Method KB 13 section B.
      1. Pillars: 3-5 per brand, each with who it is for and what it proves.
      2. Calendar (Linear document): date, pillar, format, hook, caption, call to action, owner, status. Start with 3 posts and 3 short videos a week.
      3. Each piece: hook in the first 2 seconds or line, one message, real footage, a call to action that matches the objective; caption first line works alone, 2-4 short lines, 3-5 hashtags. Give 2-3 variants and pick one.
      4. Video scripts as a table: time, shot, on-screen text, voice-over; under 30 s.
      5. Bahasa Indonesia for customers. Cilook: run /cilook-brand-check before handing over. Mark "Draft, needs approval from <owner>".
    tools: []
  - slug: whatsapp-crm
    title: "WhatsApp and CRM"
    summary: "Plan consent-based WhatsApp broadcasts and journeys, and draft templates."
    instructions: |-
      Method KB 13 section C.
      1. Consent: only people who gave this company their number for this purpose; record where and when; every broadcast ends with how to stop ("Balas STOP").
      2. Cost line in every plan: business-sent messages cost about Rp 357-390 each (verify before budgeting).
      3. Segment (lead, first-time, member, lapsed; product; area); never one blast to everyone.
      4. Templates: utility or marketing, greeting with name, one message, one button or link, stop line. Max one marketing message a week per person.
      5. Journeys: welcome (day 0/3/7), reminder, win-back (30/60 days), review request.
      6. Measures: delivered, read, replied, clicked, converted, opt-outs; stop a template above 2% opt-outs. No sensitive data in the CRM.
    tools: []
  - slug: weekly-marketing-report
    title: "Weekly marketing report"
    summary: "Write the Monday one-page marketing report for one company."
    instructions: |-
      Method KB 13 section D. For Monday-Sunday last week, a Linear document "Marketing weekly <company> <yyyy-ww>":
      1. Headline: what moved and why, one sentence.
      2. KPI table: this week, last week, 4-week average, target; the company's funnel plus a line per channel (Maps, Instagram, TikTok, WhatsApp, ads spend and cost per result).
      3. What worked and what did not, each with the post, template or campaign as evidence.
      4. Three actions for this week with owner and the KPI each should move.
      5. Data gaps: "n/a: <who supplies it>". Never invent an actual; before launch report readiness instead.

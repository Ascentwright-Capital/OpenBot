  - slug: cilook-nanny-runsheet
    title: "Nanny or babysitter run-sheet"
    summary: "Write onboarding and daily run-sheets for the nanny or babysitter in simple Bahasa."
    instructions: |-
      1. Simple Bahasa Indonesia, one instruction per line, short words, no jargon.
      2. Day one: what Cilook is (in her terms), what she gets, what she taps and when, how long (under 2 minutes a day), who to ask.
      3. Daily: the plan arrives (time), what to do, how to log in at most 3 short batches.
      4. Safety floor lines and "if the child is unwell or hurt: tell the parent at once"; never medical advice.
      5. Run it through /cilook-brand-check; mark "Draft, Destrin approves".

  - slug: nusa-auto-price-proposal
    title: "Propose a Nusa Auto price change"
    summary: "One-page proposal for a price, plan, discount or promotion, with the economics by window."
    instructions: |-
      KB 15 Part 2, job B.
      1. What changes and why now.
      2. Economics by window (off / wdp / we): contribution per bay-minute; net per member = fee + top-ups + extras - washer fee - consumables (Rp 12-23k) - pick-up - walk-ins pushed out; cannibalisation; effect on monthly EBITDA and payback. Show inputs.
      3. Guardrail check, each pass/fail: no unlimited plan; extra washes at or above the floors (weekday morning 20/25/30k, weekend 45-60k); discount over 10% needs Arthur; no price war; Hidrolik ceiling ~Rp 70k; no consumer pick-up at launch; weekend caps.
      4. The test that validates it, with a decision rule.
      5. Systems that must change. End with the decision Arthur must make and your recommendation.

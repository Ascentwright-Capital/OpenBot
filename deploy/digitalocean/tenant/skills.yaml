  - slug: cilook-feature-card
    title: "Cilook feature card"
    summary: "Turn a pain point or idea into a feature card with the boundary check."
    instructions: |-
      1. Problem: which pain point (1 coordination, 2 trust/knowledge/direction, 3 economics, or nanny), who has it, evidence (KB 16 section 5, small n stated).
      2. The smallest version that solves it; what the parent, guardian and nanny or babysitter each do; input time (nanny under 2 minutes a day, no double entry).
      3. What AI does and does not do; parents approve, change or veto.
      4. Boundary check (KB 16 section 4): no diagnosis, scores, growth charts or monitoring; milestone layer = reminders, information, records; no processed food or brands; no audio, no AI on photos, no training on family data.
      5. How we know it works (measure and decision rule); open questions; priority against D-012, D-023, D-025 and the pilot dates. Propose changes to Fausto's Feature Map; never overwrite it.
    tools: []
  - slug: cilook-experiment
    title: "Cilook experiment design"
    summary: "Design a pilot experiment with hypothesis, homes, measure and decision rule."
    instructions: |-
      1. Hypothesis in one sentence and the decision it informs.
      2. Homes and days needed; walk the pilot calendar (Wave 1 16 Nov-18 Dec, Wave 2 4 Jan-5 Feb, Gate A 29 Jan) to check it fits; baseline days first.
      3. Measure, how it is logged and by whom; minimum data before reading it (KB 17 section 6).
      4. Decision rule (what result means build, change or drop).
      5. Cost per home and who runs it. Only in consented homes; never a measure that makes the nanny report against herself.

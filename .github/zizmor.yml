# zizmor configuration, static analysis for GitHub Actions workflows.
#
# Docs: https://docs.zizmor.sh/configuration/
#
# This lives at `.github/zizmor.yml` because zizmor discovers it there. The workflow at
# `.github/workflows/security_zizmor.yml` runs it and fails on findings at the configured level.
#
# Findings that cannot be remediated belong under `rules:` with a justification. Blanket suppressions
# are not allowed.

rules:
  # `template-injection` flags untrusted ${{ }} expansions inside `run:` scripts. Route values
  # through `env:` and reference the environment variable inside the shell.
  template-injection:
    ignore: []

  # Every action is pinned to a commit hash. The one exception is the org's own reusable workflows
  # in Ascentwright-Capital/.github: they follow `main` on purpose, so a rule changed there (the AI
  # credit check) reaches this repository without a pull request here.
  unpinned-uses:
    config:
      policies:
        "Ascentwright-Capital/.github/*": ref-pin
        "*": hash-pin
